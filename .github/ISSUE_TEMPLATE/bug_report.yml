name: Bug report
description: Something in Aurelune doesn't work the way it should
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        **Security problem?** Don't post it here. Follow the instructions in SECURITY.md in the repository and report it privately.
        Please search the existing issues first, and **remove secrets** (API keys, tokens, database URIs, cookies) from anything you paste.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Web app
        - Desktop app (Electron)
        - Mobile app (Capacitor)
        - Server / API
        - Creator Studio and uploads
        - Storage (local disk)
        - Storage (PostFile)
        - Player, equalizer or lyrics
        - Search, library or playlists
        - Admin panel
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? What did you expect to see instead?
      placeholder: "When I search for a song and press Space, ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, as short as you can make them.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the output of `git rev-parse --short HEAD`.
      placeholder: "e.g. 1.0.0 or a1b2c3d"
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How do you run Aurelune?
      options:
        - Self-hosted (Node.js + MongoDB)
        - Vercel + MongoDB Atlas
        - Desktop app
        - Docker
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Browser / OS
      placeholder: "e.g. Chrome 130 on Windows 11, Safari on iPhone 15"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, console errors or screenshots
      description: Browser console, server log, or a screenshot / short recording. Secrets removed, please.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
        - label: I removed secrets (keys, tokens, URIs, cookies) from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
